# Recipients per host: the host's own key (decrypts at activation) + the admin key (edits from the dev machine).
# jiban: `ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub`
# admin: `age-keygen -o ~/.config/sops/age/keys.txt` (backed up in the password manager)
keys:
  - &admin age1vqcwxk24dl4wht0d63tcrd90uwygek2rtaw2p4klz2wkz2d8wpsqc57tyf
  - &jiban age1huncufpm34n6xxjk97fp8dpn5uy66d0ylwzhmrvq0lkz78avwplq59t67f
creation_rules:
  - path_regex: secrets/jiban/.*
    key_groups:
      - age:
          - *admin
          - *jiban
