# Runs on the host runners (modules/ci/forgejo-runner.nix), one job per Nix system: each Linux job
# builds its system's checks and evaluates only the machines of its system (an x86_64 runner cannot
# build the import-from-derivation of an aarch64 machine), jiban runs `nix flake check` and builds
# its system. The formatting and hooks run once, on x86_64. Nothing is switched.
# The encrypted trees (.gitattributes) are checked, then unlocked with the runners' git-crypt key.
on:
  push:
  pull_request:

# The runners have nu on their PATH (forgejo-runner.nix).
defaults:
  run:
    shell: nu --no-config-file {0}

jobs:
  x86_64-linux:
    runs-on: x86_64-linux
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: scripts/hooks/pre-commit
      - run: git-crypt unlock /run/secrets/git-crypt-key
      - run: nix fmt -- --ci
      # checks.<system> one at a time, then the machines whose hostPlatform is this system.
      - run: |
          let system = (nix eval --impure --raw --expr 'builtins.currentSystem')
          let checks = (nix eval --impure --json .#checks --apply 'c: builtins.attrNames c.${builtins.currentSystem}' | from json)
          for c in $checks { nix build -L --no-link $".#checks.($system).($c)" }
          let hosts = (nix eval --impure --json .#nixosConfigurations --apply 'cs: builtins.filter (n: cs.${n}.pkgs.stdenv.hostPlatform.system == builtins.currentSystem) (builtins.attrNames cs)' | from json)
          if ($hosts | is-empty) { error make { msg: $"no machine for ($system)" } }
          for h in $hosts { print $"($h): (nix eval --raw $'.#nixosConfigurations.($h).config.system.build.toplevel.drvPath')" }

  aarch64-linux:
    runs-on: aarch64-linux
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: git-crypt unlock /run/secrets/git-crypt-key
      # checks.<system> one at a time, then the machines whose hostPlatform is this system.
      - run: |
          let system = (nix eval --impure --raw --expr 'builtins.currentSystem')
          let checks = (nix eval --impure --json .#checks --apply 'c: builtins.attrNames c.${builtins.currentSystem}' | from json)
          for c in $checks { nix build -L --no-link $".#checks.($system).($c)" }
          let hosts = (nix eval --impure --json .#nixosConfigurations --apply 'cs: builtins.filter (n: cs.${n}.pkgs.stdenv.hostPlatform.system == builtins.currentSystem) (builtins.attrNames cs)' | from json)
          if ($hosts | is-empty) { error make { msg: $"no machine for ($system)" } }
          for h in $hosts { print $"($h): (nix eval --raw $'.#nixosConfigurations.($h).config.system.build.toplevel.drvPath')" }

  macos:
    runs-on: aarch64-darwin
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: git-crypt unlock /run/secrets/git-crypt-key
      - run: nix flake check -L
