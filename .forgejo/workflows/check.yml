# Runs on the two host runners (modules/ci/forgejo-runner.nix): ishizue checks what Linux can build
# and the formatting, jiban builds its own system. Nothing is switched. The encrypted trees
# (.gitattributes) are checked, then unlocked with the runners' git-crypt key (forgejo-runner.nix).
on:
  push:
  pull_request:

# The runners have nu on their PATH (forgejo-runner.nix).
defaults:
  run:
    shell: nu --no-config-file {0}

jobs:
  linux:
    runs-on: linux
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: scripts/hooks/pre-commit
      - run: git-crypt unlock /run/secrets/git-crypt-key
      - run: nix fmt -- --ci
      # Builds checks.aarch64-linux (ishizue's system) and evaluates the rest.
      - run: nix flake check -L

  macos:
    runs-on: macos
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: git-crypt unlock /run/secrets/git-crypt-key
      - run: nix build --no-link -L .#darwinConfigurations.jiban.system
